<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحقق من الاعتمادات | International College of Entrepreneurship</title>
    
    <!-- استدعاء مكتبة PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px;
        }

        .container { 
            background: white; padding: 40px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%; max-width: 600px; 
            border-top: 6px solid #b8860b; /* لون ذهبي لتمييز الاعتمادات */
            animation: fadeIn 0.8s ease-out forwards;
            display: flex; flex-direction: column; align-items: center;
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        .logo { width: 130px; margin-bottom: 20px; transition: transform 0.3s; }
        .logo:hover { transform: scale(1.05); }

        .college-title { font-size: 22px; color: #1e3a8a; font-weight: bold; margin: 0 0 10px 0; text-align: center; }
        .page-subtitle { font-size: 16px; color: #b8860b; font-weight: bold; margin-bottom: 25px; text-align: center; }
        
        .verify-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; 
            border: 2px solid #cbd5e0; border-radius: 8px; font-size: 16px; text-align: center; 
            transition: border-color 0.3s; 
        }
        input:focus { border-color: #b8860b; outline: none; }
        
        button { 
            background-color: #b8860b; color: white; border: none; padding: 14px 24px; 
            border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; 
            transition: background-color 0.3s; 
        }
        button:hover { background-color: #996515; }
        
        #result { 
            margin-top: 25px; text-align: right; padding: 20px; 
            background: #fdfaf0; border-radius: 8px; display: none; 
            border: 1px solid #f6e0b5; width: 100%;
        }

        .result-item { margin-bottom: 12px; font-size: 15px; color: #2d3748; display: flex; align-items: flex-start; }
        .result-item strong { color: #1a202c; margin-left: 8px; flex-shrink: 0; min-width: 110px; }
        
        .status-active { color: #276749; font-weight: bold; background: #c6f6d5; padding: 4px 10px; border-radius: 4px; display: inline-block;}
        .status-expired { color: #c53030; font-weight: bold; background: #fed7d7; padding: 4px 10px; border-radius: 4px; display: inline-block;}

        /* Navigation Links */
        .nav-links { margin-top: 20px; text-align: center; }
        .nav-links a { color: #4a5568; text-decoration: none; font-size: 14px; font-weight: bold; border-bottom: 1px solid #4a5568;}
        .nav-links a:hover { color: #1e3a8a; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="شعار كلية ريادة الأعمال الدولية" class="logo">
    <h1 class="college-title">كلية ريادة الأعمال الدولية (I.C.E)</h1>
    <div class="page-subtitle">بوابة التحقق من الاعتمادات والشراكات</div>

    <div style="width: 100%; text-align: center; margin-bottom: 20px;">
        <span style="color: #718096; font-size: 14px;">أدخل الاسم للتحقق (باللغة العربية أو الإنجليزية)</span>
    </div>
    
    <div class="verify-wrapper">
        <input type="text" id="searchInput" placeholder="مثال: وديع أو Wadea">
        <button onclick="verifyPartner()">بحث واستعلام</button>
        <div id="result"></div>
    </div>
</div>

<div class="nav-links">
    <a href="index.html"><i class="fas fa-graduation-cap"></i> العودة لنظام التحقق من الشهادات التدريبية</a>
</div>

<script>
    // رابط جوجل شيتس الخاص بالاعتمادات الذي زودتني به
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzIWoz1zrtdBwT9rYmvQgGt8rjz2SIK0Z2IOt9MavvrZL548UajhqCmji5eIIHII1VOpI4rWx1pEzP/pub?gid=522399146&single=true&output=csv';

    document.getElementById("searchInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            verifyPartner();
        }
    });

    function verifyPartner() {
        const inputStr = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultDiv = document.getElementById('result');
        
        if(!inputStr) {
            alert('الرجاء إدخال الاسم للبحث');
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'جاري البحث في سجلات الاعتمادات...';

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                
                // البحث الجزئي (المرن) في الاسم العربي أو الإنجليزي
                const record = data.find(row => 
                    (row.ArabicName && row.ArabicName.toLowerCase().includes(inputStr)) || 
                    (row.EnglishName && row.EnglishName.toLowerCase().includes(inputStr))
                );

                if(record) {
                    // حساب الحالة الذكية بناءً على تاريخ الانتهاء
                    let statusHTML = '';
                    if(record.ExpiryDate) {
                        const expiryDate = new Date(record.ExpiryDate);
                        const today = new Date();
                        
                        if (expiryDate >= today) {
                            statusHTML = `<span class="status-active">🟢 اعتماد ساري (حتى ${record.ExpiryDate})</span>`;
                        } else {
                            statusHTML = `<span class="status-expired">🔴 اعتماد منتهي (منذ ${record.ExpiryDate})</span>`;
                        }
                    } else {
                        statusHTML = `<span>تاريخ غير محدد</span>`;
                    }

                    resultDiv.innerHTML = `
                        <div style="text-align: center; margin-bottom: 20px;">
                            <i class="fas fa-id-badge" style="font-size: 30px; color: #b8860b;"></i>
                            <div style="font-weight: bold; color: #b8860b; margin-top: 5px;">تم العثور على سجل معتمد</div>
                        </div>
                        <div class="result-item"><strong>الاسم (عربي):</strong> <span>${record.ArabicName || '-'}</span></div>
                        <div class="result-item"><strong>الاسم (إنجليزي):</strong> <span>${record.EnglishName || '-'}</span></div>
                        <div class="result-item"><strong>الصفة/الاعتماد:</strong> <span>${record.Capacity || '-'}</span></div>
                        <div class="result-item"><strong>النطاق الجغرافي:</strong> <span>${record.Location || '-'}</span></div>
                        <div class="result-item"><strong>تاريخ الإصدار:</strong> <span>${record.IssueDate || '-'}</span></div>
                        <div class="result-item" style="margin-top: 15px;"><strong>حالة الاعتماد:</strong> <span>${statusHTML}</span></div>
                    `;
                    resultDiv.style.background = '#fdfaf0';
                    resultDiv.style.borderColor = '#f6e0b5';
                } else {
                    resultDiv.innerHTML = `<p style="color: #c53030; font-weight: bold; margin: 0; text-align: center;">❌ لم يتم العثور على سجل يطابق هذا الاسم.</p>`;
                    resultDiv.style.background = '#fff5f5';
                    resultDiv.style.borderColor = '#feb2b2';
                }
            },
            error: function(err) {
                resultDiv.innerHTML = `<p style="color: #c53030; margin: 0; text-align: center;">حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.</p>`;
            }
        });
    }
</script>

</body>
</html>
